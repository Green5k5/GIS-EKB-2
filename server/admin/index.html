<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админ-панель · ГИС Екатеринбург</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>

  <!-- Экран входа -->
  <section id="login-screen" class="login" hidden>
    <form id="login-form" class="card login__card">
      <div class="logo">Е</div>
      <h1>Админ-панель</h1>
      <p class="muted">ГИС Екатеринбург. Введите ключ администратора.</p>
      <input id="login-key" type="password" placeholder="Ключ" aria-label="Ключ администратора" autocomplete="current-password" required>
      <button type="submit" class="btn btn--primary">Войти</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- Админка -->
  <div id="app" class="layout" hidden>

    <header class="topbar">
      <div class="logo">Е</div>
      <div class="topbar__title">ГИС<br>Екатеринбург</div>
      <span class="topbar__label">Админ-панель</span>
      <div class="topbar__actions">
        <a href="/" class="btn btn--small">На сайт</a>
        <button id="logout-btn" class="btn btn--small">Выйти</button>
      </div>
    </header>

    <nav class="sidebar">
      <a href="#dashboard" class="sidebar__link">Сводка</a>
      <a href="#records"   class="sidebar__link">Записи</a>
      <a href="#plots"     class="sidebar__link">Контуры</a>
      <a href="#import"    class="sidebar__link">Импорт</a>
      <a href="#releases"  class="sidebar__link">Публикации</a>
    </nav>

    <main class="content">

      <!-- Показывается один раздел, остальные скрывает router.js -->
      <section id="section-dashboard" class="section" data-title="Сводка">
        <h2>Сводка</h2>
        <div id="stats" class="stats"></div>
      </section>

      <section id="section-records" class="section" data-title="Записи" hidden>
        <h2>Записи</h2>
        <form id="records-filter" class="toolbar">
          <input id="records-q" type="search" placeholder="Поиск: ID, номер, ФИО" aria-label="Поиск записей">
          <select id="records-settlement" aria-label="Поселение"></select>
          <button type="submit" class="btn btn--primary">Найти</button>
          <button type="button" id="records-add" class="btn">Добавить запись</button>
        </form>
        <div id="records-table" class="card table-wrap"></div>
        <div id="records-pagination" class="pagination"></div>
      </section>

      <section id="section-plots" class="section" data-title="Контуры" hidden>
        <h2>Контуры</h2>
        <p class="muted">Раздел в разработке.</p>
      </section>

      <section id="section-import" class="section" data-title="Импорт" hidden>
        <h2>Импорт</h2>
        <p class="muted">Раздел в разработке.</p>
      </section>

      <section id="section-releases" class="section" data-title="Публикации" hidden>
        <h2>Публикации</h2>
        <p class="muted">Раздел в разработке.</p>
      </section>

    </main>
  </div>

  <!-- Окно с формой -->
  <div id="modal" class="modal" hidden>
    <div class="modal__window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal__header">
        <h2 id="modal-title"></h2>
        <button type="button" id="modal-close" class="modal__close" aria-label="Закрыть">×</button>
      </header>
      <form id="modal-form" class="modal__body" novalidate></form>
      <footer class="modal__footer">
        <p id="modal-error" class="error"></p>
        <button type="button" id="modal-cancel" class="btn">Отмена</button>
        <button type="submit" id="modal-save" class="btn btn--primary" form="modal-form">Сохранить</button>
      </footer>
    </div>
  </div>

  <script type="module" src="/admin/js/dev-reload.js"></script>
  <script type="module" src="/admin/js/main.js"></script>
</body>
</html>
