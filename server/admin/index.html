<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS-EKB — Админка</title><style>
body{font:14px system-ui;margin:0;background:#f5f6f8;color:#20242a}header{background:#20252b;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}main{max-width:1400px;margin:20px auto;padding:0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px}button{cursor:pointer;background:#20252b;color:white}.muted{color:#6b7280}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:7px;border-bottom:1px solid #eee;text-align:left}.table tr:hover{background:#fafafa}.hidden{display:none!important}.status{padding:8px;border-radius:6px;background:#eef2ff;margin:8px 0}.danger{background:#a11}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.modal>div{background:#fff;max-height:90vh;overflow:auto;width:min(900px,95vw);padding:20px;border-radius:10px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{display:flex;flex-direction:column;gap:4px}.form .wide{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style></head><body><header><b>GIS-EKB — Админ-панель</b><button id="logout">Выйти</button></header><main>
<div id="login" class="card"><h2>Вход</h2><p class="muted">Ключ берётся из серверного <code>ADMIN_KEY</code>.</p><input id="key" type="password" placeholder="ADMIN_KEY"><button id="loginBtn">Войти</button><div id="loginErr"></div></div>
<div id="app" class="hidden"><div id="stats" class="status"></div>
<div class="grid"><section class="card"><h2>Записи</h2><div class="toolbar"><input id="q" placeholder="ID, номер, ФИО"><select id="settlement"><option value="">Все поселения</option></select><button id="search">Найти</button><button id="newRecord">Добавить</button></div><div id="records"></div></section>
<section class="card"><h2>Импорт записей</h2><p class="muted">JSON или CSV UTF-8. Сначала выполняется проверка, затем применение.</p><input id="importFile" type="file" accept=".json,.csv"><select id="importMode"><option value="add">Добавить</option><option value="upsert">Обновить / upsert</option><option value="replace">Заменить набор</option></select><select id="importSettlement"><option value="">Область не выбрана</option></select><button id="validateImport">Проверить</button><pre id="importReport"></pre><button id="applyImport" class="hidden">Применить проверенный импорт</button></section>
<section class="card full"><h2>Контуры</h2><div class="toolbar"><button id="refreshPlots">Обновить</button><button id="newPlot">Добавить контур</button></div><div id="plots"></div></section>
<section class="card full"><h2>Публикации</h2><div class="toolbar"><input id="releaseNote" placeholder="Комментарий к публикации"><button id="publish">Опубликовать текущие данные</button></div><div id="releases"></div></section></div></div></main>
<div id="modal" class="modal hidden"><div><h2 id="modalTitle"></h2><form id="form" class="form"></form><div class="actions"><button type="button" id="cancel">Отмена</button><button type="button" id="save">Сохранить</button></div></div></div>
<script src="/admin/admin.js"></script></body></html>
